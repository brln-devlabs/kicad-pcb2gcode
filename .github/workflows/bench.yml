name: pcb2gcode timing

# Manual only: how long pcb2gcode takes on a board with ground pours, and
# which settings change that.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install KiCad 9
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
      - name: Install pcb2gcode (release build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(gh release view -R pcb2gcode/pcb2gcode --json assets -q '.assets[].name' | grep -i "ubuntu-24.04_1_83_gplusplus_none" | grep '\.tar\.gz$' | head -1)
          mkdir -p "$HOME/p2g" && cd "$HOME/p2g"
          gh release download -R pcb2gcode/pcb2gcode --pattern "$asset"
          tar xzf "$asset"
          dir=$(dirname "$(find . -name pcb2gcode -type f | head -1)")
          sudo apt-get install -y libgtkmm-2.4-1v5 libglib2.0-bin libboost-program-options1.83.0
          printf '#!/bin/sh\nLD_LIBRARY_PATH=%s/.libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH} exec %s/pcb2gcode "$@"\n' "$PWD/$dir" "$PWD/$dir" | sudo tee /usr/local/bin/pcb2gcode
          sudo chmod +x /usr/local/bin/pcb2gcode
          pcb2gcode --version
      - name: Board with ground pours
        run: |
          python3 tests/e2e/make_pour.py
          /usr/bin/python3 -c "
          import pcbnew
          p = 'tests/e2e/pour.kicad_pcb'
          b = pcbnew.LoadBoard(p)
          pcbnew.ZONE_FILLER(b).Fill(b.Zones())
          pcbnew.SaveBoard(p, b)
          print('zones filled:', [z.GetLayerName() for z in b.Zones()])
          "
      - name: Plugin run (exports and the configured pcb2gcode runs)
        working-directory: plugin
        run: |
          start=$(date +%s)
          timeout 3600 python3 -m kicad_pcb2gcode ../tests/e2e/pour.kicad_pcb --lang en || true
          echo "plugin run took $(( $(date +%s) - start )) s"
          grep -c "" ../tests/e2e/cam/*.gbr 2>/dev/null || wc -l ../tests/e2e/gcode/cam/*.gbr
      - name: Timing with changed settings
        run: python3 tests/e2e/bench_pcb2gcode.py tests/e2e/gcode 1200
