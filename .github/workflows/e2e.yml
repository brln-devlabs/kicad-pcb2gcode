name: End-to-end

# Runs the whole pipeline with the real kicad-cli (KiCad 9) and pcb2gcode on
# the demo boards in tests/e2e/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install KiCad 9
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Install pcb2gcode (release build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view -R pcb2gcode/pcb2gcode --json tagName,assets -q '.tagName, .assets[].name'
          asset=$(gh release view -R pcb2gcode/pcb2gcode --json assets -q '.assets[].name' | grep -i "ubuntu-24.04_1_83_gplusplus_none" | grep '\.tar\.gz$' | head -1)
          echo "asset: $asset"
          mkdir -p "$HOME/p2g" && cd "$HOME/p2g"
          gh release download -R pcb2gcode/pcb2gcode --pattern "$asset"
          tar xzf "$asset"
          dir=$(dirname "$(find . -name pcb2gcode -type f | head -1)")
          sudo apt-get install -y libgtkmm-2.4-1v5 libglib2.0-bin libboost-program-options1.83.0
          ldd "$dir/pcb2gcode" | grep "not found" || true
          printf '#!/bin/sh\nLD_LIBRARY_PATH=%s/.libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH} exec %s/pcb2gcode "$@"\n' "$PWD/$dir" "$PWD/$dir" | sudo tee /usr/local/bin/pcb2gcode
          sudo chmod +x /usr/local/bin/pcb2gcode
          pcb2gcode --version
      - name: Run the plugin pipeline
        working-directory: plugin
        run: |
          set -x
          python3 ../tests/e2e/make_dense.py
          # flip frame: outline cut first, from the top
          python3 -m kicad_pcb2gcode ../tests/e2e/rect.kicad_pcb --frame --sides both --lang en || true
          mkdir -p ../out/frame && cp -r ../tests/e2e/gcode/. ../out/frame/ && rm -rf ../tests/e2e/gcode
          rm -f ../tests/e2e/rect.pcb2gcode.json
          for board in rounded rect dense; do
            timeout 600 python3 -m kicad_pcb2gcode "../tests/e2e/$board.kicad_pcb" --lang en || true
            ls -l "../tests/e2e/gcode" || true
            mkdir -p "../out/$board"
            cp -r ../tests/e2e/gcode/. "../out/$board/" || true
            rm -rf ../tests/e2e/gcode
          done
      - name: Settings window and preview (real wxPython under Xvfb)
        run: |
          sudo apt-get install -y python3-wxgtk4.0 xvfb
          for board in rounded dense; do
            timeout 900 xvfb-run -a -s "-screen 0 1600x1000x24" /usr/bin/python3 tests/e2e/gui_check.py "tests/e2e/$board.kicad_pcb" "out/gui-$board"
            rm -rf tests/e2e/gcode
          done
          # snapshots as text, to look at them without downloading the artifact
          for f in out/gui-dense/preview_00_fit.png out/gui-dense/preview_00_glide.png out/gui-dense/preview_00_zoom.png out/gui-dense/preview_00_rest.png; do
            [ -f "$f" ] && { echo "PNG $f"; base64 -w0 "$f"; echo; }
          done
      - name: Dump preview SVGs (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          for f in out/dense/preview/main/processed_front_final.svg out/dense/preview/mask/processed_front_final.svg; do
            [ -f "$f" ] && { echo "SVG $f"; gzip -9c "$f" | base64 -w0; echo; }
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-output
          path: out/
      - name: G-code extents
        run: |
          for d in out/rect out/frame out/rounded; do echo "== $d"; python3 tests/e2e/extents.py $d; grep -E "^(x-offset|y-offset|mirror-axis|zero-start|cut-side|drill-side)" $d/millproject; done
      - name: Check the outputs
        run: |
          python3 - <<'PY'
          import glob, os, sys
          ok = True
          for board in ("rounded", "rect", "dense"):
              files = sorted(os.path.basename(p) for p in glob.glob(f"out/{board}/*.ngc"))
              print(board, files)
              for want in ("back", "drill", "outline", "mask_front", "mask_back"):
                  if f"{board}_{want}.ngc" not in files:
                      print(f"  MISSING {board}_{want}.ngc"); ok = False
          frame = sorted(os.path.basename(p) for p in glob.glob("out/frame/*.ngc"))
          print("frame", frame)
          if "rect_outline.ngc" not in frame or "cut-side=front" not in open("out/frame/millproject").read():
              print("  flip frame: outline missing or cut from the wrong side"); ok = False
          sys.exit(0 if ok else 1)
          PY
